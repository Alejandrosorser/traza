name: Copia de datos en vivo (Renfe)

# Descarga los datos abiertos de Renfe y los guarda en vivo/*.json.
# La web los lee de aquí si el navegador no puede conectar directamente con Renfe.
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivo
  cancel-in-progress: true

jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Descargar datos
        run: python scripts/descarga_vivo.py
      - name: Publicar si han cambiado
        run: |
          git config user.name "traza-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vivo/*.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos en vivo $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
